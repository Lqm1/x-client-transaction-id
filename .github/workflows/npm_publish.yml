name: NPM Publish

on:
  push:
    tags:
      - "*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Check the tag matches the package versions
        run: |
          test "$GITHUB_REF_NAME" = "$(jq -r .version package.json)"
          test "$GITHUB_REF_NAME" = "$(jq -r .version jsr.json)"

      - run: bun run typecheck

      - run: bun test

      # Trusted publishing needs npm 11.5.1+, which ships with Node.js 24
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # prepack builds dist/ with Bun before the tarball is created
      - run: npm publish
